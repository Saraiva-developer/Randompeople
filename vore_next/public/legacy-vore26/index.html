<!doctype html>
<html lang="pt" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="google" content="notranslate" />
  <title>Vore Website 26</title>
  <link rel="stylesheet" href="./css/styles.css?v=20260510-mobile-dock-v2" />
</head>
<body>
  <section id="entryGate" class="entry-gate"></section>

  <div id="appShell" class="app-shell">
    <header class="topbar">
      <div class="brand notranslate" translate="no">Vore</div>
      <nav id="mainNav" class="main-nav notranslate" translate="no">
        <button data-tab="home" class="active"><span class="nav-btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3v-10.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="nav-btn-label">Home</span></button>
        <button data-tab="explore"><span class="nav-btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="nav-btn-label">Explorar</span></button>
        <button data-tab="notifications"><span class="nav-btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M18 9a6 6 0 1 0-12 0c0 7-3 7-3 7h18s-3 0-3-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.7 21a2 2 0 0 0 2.6 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="nav-btn-label">Notificações</span></button>
        <button data-tab="profile"><span class="nav-btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/><path d="M4 20c1.5-3.5 4.1-5 8-5s6.5 1.5 8 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="nav-btn-label">Perfil</span></button>
        <button data-tab="edit"><span class="nav-btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m16.5 3.5 4 4L8 20l-5 1 1-5 12.5-12.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></span><span class="nav-btn-label">Editar Perfil</span></button>
        <button data-tab="settings"><span class="nav-btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1 1 0 0 0 .2 1.1l.1.1a1.2 1.2 0 0 1 0 1.7l-1.2 1.2a1.2 1.2 0 0 1-1.7 0l-.1-.1a1 1 0 0 0-1.1-.2 1 1 0 0 0-.6.9V20a1.2 1.2 0 0 1-1.2 1.2h-1.7A1.2 1.2 0 0 1 10 20v-.2a1 1 0 0 0-.6-.9 1 1 0 0 0-1.1.2l-.1.1a1.2 1.2 0 0 1-1.7 0l-1.2-1.2a1.2 1.2 0 0 1 0-1.7l.1-.1a1 1 0 0 0 .2-1.1 1 1 0 0 0-.9-.6H4A1.2 1.2 0 0 1 2.8 13v-2A1.2 1.2 0 0 1 4 9.8h.2a1 1 0 0 0 .9-.6 1 1 0 0 0-.2-1.1l-.1-.1a1.2 1.2 0 0 1 0-1.7l1.2-1.2a1.2 1.2 0 0 1 1.7 0l.1.1a1 1 0 0 0 1.1.2 1 1 0 0 0 .6-.9V4A1.2 1.2 0 0 1 10.7 2.8h2A1.2 1.2 0 0 1 14 4v.2a1 1 0 0 0 .6.9 1 1 0 0 0 1.1-.2l.1-.1a1.2 1.2 0 0 1 1.7 0l1.2 1.2a1.2 1.2 0 0 1 0 1.7l-.1.1a1 1 0 0 0-.2 1.1 1 1 0 0 0 .9.6h.2A1.2 1.2 0 0 1 21.2 11v2A1.2 1.2 0 0 1 20 14.2h-.2a1 1 0 0 0-.4.8Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="nav-btn-label">Definições</span></button>
      </nav>
    </header>

    <div id="editNavHandle" class="edit-nav-handle" aria-hidden="true">
      <button type="button" class="edit-nav-tab" data-edit-nav-toggle="1" aria-label="Abrir navegacao" title="Abrir navegacao">
        <span class="edit-nav-tab-arrow" aria-hidden="true">&#9654;</span>
      </button>
    </div>

    <main class="layout">
      <section id="home" class="screen active">
        <div id="homeInsights" class="chips home-insights"></div>
        <div id="homeFilterChips" class="chips chips-scroll notranslate" translate="no"></div>
        <h3 class="section-title">Sugestões</h3>
        <div id="homeSuggested" class="suggested-strip"></div>
        <h3 id="homeProfilesTitle" class="section-title">Destaques</h3>
        <div id="homeCards" class="grid"></div>
      </section>

      <section id="explore" class="screen">
        <div class="explore-search-row">
          <div class="explore-search-box">
            <span class="explore-search-icon">&#8981;</span>
            <input id="searchInput" class="input explore-search-input" placeholder="Pesquisar perfis..." />
            <button id="exploreOpenFilters" class="explore-search-filter-btn" type="button" aria-label="Filtros avançados">&#9881;</button>
          </div>
        </div>
        <div id="exploreSortRow" class="chips chips-scroll"></div>
        <div class="explore-meta-row">
          <span id="exploreMetaText" class="muted">0 resultados</span>
          <span id="exploreTrendText" class="muted"></span>
        </div>
        <div id="exploreActiveFilters" class="explore-active-filters"></div>
        <div id="exploreCards" class="grid"></div>
        <div id="explorePager" class="explore-pager"></div>
        <div id="exploreSentinel" class="explore-sentinel"></div>
      </section>

      <section id="profile" class="screen">
        <div id="profileHead"></div>
        <div id="profileTabs" class="chips"></div>
        <div id="profileSubTabs" class="chips"></div>
        <div id="profileContent" class="panel"></div>
      </section>

      <section id="notifications" class="screen">
        <h2>Notificações</h2>
        <div id="notificationsFilters" class="chips"></div>
        <div id="notificationsList" class="panel">Sem notificações.</div>
      </section>

      <section id="edit" class="screen">
        <div id="editPlaceholder" class="panel">A carregar editor...</div>
      </section>

      <section id="settings" class="screen">
        <h2>Definições</h2>
        <div id="settingsInfo" class="panel">A carregar definições...</div>
      </section>
    </main>

    <aside id="desktopRail" class="desktop-rail" aria-label="Destaques desktop"></aside>

  </div>

  <script type="module" src="./js/app.js?v=20260510-mobile-dock-v2"></script>
</body>
</html>
